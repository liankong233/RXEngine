[project]
name = "rxengine"
version = "0.1.0"
description = "RXEngine MCP server for JavaScript sandboxing and reverse engineering automation"
readme = "README.md"
authors = [{ name = "liankong", email = "xhsw.new@qq.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.14"
keywords = [
    "reverse-engineering",
    "ida",
    "angr",
    "qiling",
    "unicorn",
    "mcp",
    "sandbox",
    "deobfuscation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "angr>=9.2.213",
    "capstone>=5.0.6",
    "claripy>=9.2.213",
    "headless-ida>=0.6.7",
    "keystone-engine>=0.9.2",
    "mcp>=1.28.1",
    "pyelftools>=0.33",
    "python-dotenv>=1.2.2",
    "qiling>=1.4.6",
    "STPyV8>=13.1.201.22",
    "unicorn>=2.1.4",
    "z3-solver>=4.13.0.0",
]

[project.scripts]
rxengine = "main:main"

[project.urls]
Homepage = "https://github.com/liankong233/RXEngine"
Repository = "https://github.com/liankong233/RXEngine"
Issues = "https://github.com/liankong233/RXEngine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["extensions*", "headless_ida_mcp_server*", "sandbox*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-m 'not requires_ida and not sse and not slow'"
markers = [
    "unit: fast unit tests",
    "sandbox: JavaScript sandbox bridge tests",
    "qiling: qiling/unicorn emulation tests",
    "angr: angr/claripy symbolic execution tests",
    "z3: z3/z3ida tests",
    "ida: IDA integration tests",
    "requires_ida: tests requiring configured IDA/headless-ida environment",
    "sse: MCP/SSE integration tests",
    "slow: slower integration tests",
]
