name: Feature request
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的工作流痛点，而不是直接给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 Agent/用户如何使用它？给出期望的调用形态或输出。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - run_js / sandbox RPC
        - Lab 编排层
        - IDA 门面 / staged 写回
        - qiling / angr / z3
        - MCP 工具面
        - 文档 / 测试
        - 其他
    validations:
      required: true
